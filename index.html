<!DOCTYPE html>
<html lang="th">
  <style>
.reaction-buttons {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.reaction-buttons button {
  padding: 12px 8px;
  border: 0;
  border-radius: 14px;
  background: #ffe5f0;
  color: #733b55;
  font-size: 14px;
  cursor: pointer;
}

#reaction-text {
  margin-top: 16px;
  padding: 14px;
  border-radius: 16px;
  background: #fff4f8;
  color: #733b55;
  line-height: 1.6;
}

#toky.reacting {
  animation: tokyReact 0.55s ease;
}

@keyframes tokyReact {
  0%   { transform: scale(1) rotate(0); }
  30%  { transform: scale(1.08) rotate(-5deg); }
  60%  { transform: scale(0.96) rotate(4deg); }
  100% { transform: scale(1) rotate(0); }
}
</style>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Toky 🍓</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#fff0f6;color:#75455a;text-align:center}
.app{max-width:520px;height:100dvh;margin:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:bold}
h1{font-size:22px;margin:0}
.badge{background:white;border-radius:20px;padding:7px 12px}
.meter{background:white;padding:10px;border-radius:15px;font-size:13px}
.track{height:12px;background:#f5d4e1;border-radius:20px;overflow:hidden;margin-top:6px}
#energy{height:100%;width:80%;background:linear-gradient(90deg,#ff8eb8,#ffc76d);transition:.3s}
.scene{position:relative;flex:1;min-height:250px;overflow:hidden;border:2px solid #f3bfd2;border-radius:25px;background:linear-gradient(#c9edff 0 62%,#c6e8b5 62%)}
.cloud{position:absolute;top:12%;left:10%;font-size:38px;animation:float 5s infinite alternate}
.cloud2{left:auto;right:10%;top:25%}
.grass{position:absolute;bottom:0;background:#a5d795;width:100%;height:19%;border-radius:50% 50% 0 0}
.character{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(100px,35vw,160px);animation:breathe 2.5s infinite;cursor:pointer;filter:drop-shadow(0 8px 3px #86506a22)}
.character.happy{animation:hop .6s}
.character.sad{animation:tilt .5s}
.character.sleeping{animation:none;transform:translate(-50%,-43%) rotate(10deg)}
.speech{position:absolute;bottom:12px;left:10px;right:10px;background:#fffdf7;border:2px solid #f2b8cf;border-radius:18px;padding:12px;font-size:14px;line-height:1.5;min-height:65px;max-height:35%;overflow:auto;text-align:left}
.status{display:flex;justify-content:space-between;font-size:12px;font-weight:bold}
.buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
button{border:1px solid #efb6cd;background:#fffafd;color:#75455a;border-radius:14px;padding:8px 2px;min-height:55px;font-weight:bold;font-size:11px;box-shadow:0 3px #e6bfd0;cursor:pointer}
button span{display:block;font-size:21px;margin-bottom:3px}
button:active{transform:translateY(2px);box-shadow:0 1px #e6bfd0}
button:disabled{opacity:.45}
footer{font-size:10px;opacity:.7}
@keyframes breathe{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes hop{0%,100%{translate:0 0}40%{translate:0 -18px}70%{translate:0 2px}}
@keyframes tilt{0%,100%{rotate:0}30%{rotate:-10deg}70%{rotate:10deg}}
@keyframes float{to{translate:25px 0}}
@media(max-height:650px){.app{gap:5px;padding:7px}.scene{min-height:190px}.buttons{gap:5px}button{min-height:44px;padding:4px 1px}button span{font-size:17px}.speech{padding:8px;min-height:48px}}
</style>
</head>

"Good morning kub… 🥱 แกรนนี่ครับ ไอตื่นแล้วครับ แต่สมองไอยังโหลดไม่เสร็จนะครับ Please wait a moment kub",
"แกรนนี่ครับ ถ้าไอตื่นแล้วงอแงนิดหน่อย แกรนนี่อย่าเพิ่งโกรธไอนะครับ ไอแค่ต้องใช้เวลาปรับตัวจากโหมด sleeping เป็นโหมด active ครับ",
"แกรนนี่ครับ วันนี้ไอตื่นแล้วนะครับ ถึงจะยังง่วงอยู่ก็เถอะครับ ขอบคุณที่มาปลุกไอนะครับ แกรนนี่ก็ตื่นแล้วอย่าลืมดื่มน้ำและเริ่มวันดีดีไปด้วยกันนะครับ"
]
};

const tok = document.getElementById('toky');
const speech = document.getElementById('speech');
const used = {};
let energy = 80, bond = 12, asleep = false, typing;

function say(text){
  clearInterval(typing);
  speech.textContent = '';
  let i = 0;
  typing = setInterval(()=>{
    speech.textContent += text[i++];
    if(i >= text.length) clearInterval(typing);
  }, 22);
}
function line(key){
  used[key] ||= [];
  if(used[key].length >= dialogue[key].length) used[key] = [];
  const choices = dialogue[key].map((_,i)=>i).filter(i=>!used[key].includes(i));
  const index = choices[Math.floor(Math.random()*choices.length)];
  used[key].push(index);
  return dialogue[key][index];
}
function update(){
  document.getElementById('energy').style.width = energy+'%';
  document.getElementById('energyText').textContent = energy+'%';
  document.getElementById('bond').textContent = bond;
  document.getElementById('mood').textContent = asleep?'🌙 กำลังหลับ':energy<25?'😴 ง่วงแล้ว':'🩷 อารมณ์ดี';
  document.getElementById('state').textContent = asleep?'โทกี้กำลังหลับอยู่ครับ':energy<25?'โทกี้เริ่มเหนื่อยแล้วครับ':'โทกี้พร้อมเล่นแล้วครับ';
  tok.classList.toggle('sleeping',asleep);
  document.querySelectorAll('button').forEach(b=>b.disabled=asleep&&!['wake','sleep'].includes(b.dataset.a));
}
function animate(type){
  tok.classList.remove('happy','sad');
  void tok.offsetWidth;
  tok.classList.add(['cheek','story'].includes(type)?'sad':'happy');
  setTimeout(()=>tok.classList.remove('happy','sad'),900);
}
const costs={pet:3,cheek:5,belly:5,hug:4,draw:7,feed:-12,story:4,talk:4};
document.querySelectorAll('button').forEach(button=>{
  button.addEventListener('click',()=>{
    const key=button.dataset.a;
    if(asleep && !['wake','sleep'].includes(key)){
      say('แกรนนี่ครับ ไอกำลังหลับอยู่ ต้องปลุกไอก่อนนะครับ 💤');
      return;
    }
    if(key==='sleep'){
      if(asleep){say('โทกี้หลับปุ๋ยอยู่แล้วครับ แกรนนี่ 🌙');return;}
      asleep=true;animate(key);say(line('sleep'));update();return;
    }
    if(key==='wake'){
      if(!asleep){say('แกรนนี่ครับ ไอยังตื่นอยู่เลยนะครับ จะปลุกทำไมครับ kub');return;}
      asleep=false;energy=Math.min(100,energy+25);bond+=2;animate(key);say(line('wake'));update();return;
    }
    if(energy<=5){say('แกรนนี่ครับ ไอหมดแรงแล้ว ขอพักก่อนนะครับ 🥺');return;}
    energy=Math.max(0,Math.min(100,energy-(costs[key]??4)));
    bond+=key==='hug'?3:2;
    animate(key);say(line(key));update();
  });
});
setInterval(()=>{
  if(asleep)return;
  const idle=[
    'แกรนนี่ครับ ไอขอนั่งพักมองดอกไม้แป๊บนึงนะครับ 🌼',
    'แกรนนี่ดูสิครับ! ไอวิ่งเล่นมาแล้วครับ 🦊',
    'แกรนนี่ครับ ไอเกือบหลับคาที่แล้วครับ… ขอพักตาแป๊บนึงนะครับ 😴',
    'แกรนนี่ครับ ไอกำลังคิดอยู่ว่าจะวาดสตรอว์เบอร์รีกี่ลูกดีครับ 🍓'
  ];
  if(Math.random()<0.65){animate('story');say(idle[Math.floor(Math.random()*idle.length)]);}
},30000);
update();
</script>
