<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[onclick]").forEach(button => {
    const code = button.getAttribute("onclick");

    button.removeAttribute("onclick");

    button.addEventListener("click", () => {
      try {
        switch (code) {
          case "closePanel()":
            closePanel();
            break;
          case "openPanel('quests')":
            openPanel("quests");
            break;
          case "openPanel('foodPanel')":
            openPanel("foodPanel");
            break;
          case "openPanel('bathPanel')":
            openPanel("bathPanel");
            break;
          case "openPanel('sleepPanel')":
            openPanel("sleepPanel");
            break;
          case "petHead()":
            petHead();
            break;
          case "pinch()":
            pinch();
            break;
          case "hug()":
            hug();
            break;
          case "play()":
            play();
            break;
          case "talk()":
            talk();
            break;
          case "changeRoom(-1)":
            changeRoom(-1);
            break;
          case "changeRoom(1)":
            changeRoom(1);
            break;
          case "goRoom(0)":
            goRoom(0);
            break;
          case "goRoom(1)":
            goRoom(1);
            break;
          case "goRoom(2)":
            goRoom(2);
            break;
          case "goRoom(3)":
            goRoom(3);
            break;
          case "goRoom(4)":
            goRoom(4);
            break;
          case "sleepToky()":
            sleepToky();
            break;
          case "wakeToky()":
            wakeToky();
            break;
          case "useBathroom()":
            useBathroom();
            break;
          default:
            console.warn("ยังไม่มีการผูกปุ่ม:", code);
        }
      } catch (error) {
        console.error("เกิดข้อผิดพลาดขณะกดปุ่ม:", error);
      }
    });
  });
});
</script>
