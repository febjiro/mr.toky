<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mr. Toky 🍓</title>

<style>
:root {
  --pink: #ffb8d1;
  --deep: #e66f9c;
  --cream: #fff9f1;
  --ink: #634b5a;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: system-ui, sans-serif;
  color: var(--ink);
  background: #fff0f6;
}

body {
  height: 100dvh;
  overscroll-behavior: none;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
}

.app {
  height: 100dvh;
  width: 100%;
  max-width: 650px;
  margin: auto;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding:
    calc(env(safe-area-inset-top) + 8px)
    12px
    calc(env(safe-area-inset-bottom) + 8px);
  background:
    radial-gradient(ellipse at 15% 15%, #fff 0, transparent 34%),
    linear-gradient(160deg, #fff0f6, #fce6f1 55%, #e9f7f0);
}

/* HEADER */

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex: 0 0 auto;
}

.brand {
  font-weight: 900;
  font-size: clamp(18px, 5vw, 25px);
}

.brand span {
  color: #ed78a5;
}

.mood {
  background: #ffffffbb;
  border: 1px solid white;
  padding: 8px 11px;
  border-radius: 18px;
  font-size: 11px;
}

/* ENERGY */

.energy {
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #ffffffbb;
  border: 1px solid white;
  border-radius: 18px;
  padding: 7px 11px;
  flex: 0 0 auto;
}

.energy label {
  font-size: 12px;
  white-space: nowrap;
  font-weight: 800;
}

.bar {
  height: 10px;
  flex: 1;
  background: #f3d8e4;
  border-radius: 20px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 78%;
  border-radius: 20px;
  background: linear-gradient(90deg, #ff9cbe, #ffd17f);
  transition: width .4s;
}

/* SCENE */

.scene {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 2px 0;
  overflow: hidden;
}

.sun {
  position: absolute;
  top: 8%;
  right: 9%;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  background: #ffe6a7;
  box-shadow: 0 0 0 12px #ffe6a733;
}

.cloud {
  position: absolute;
  width: 80px;
  height: 24px;
  border-radius: 30px;
  background: #ffffff99;
  left: 7%;
  top: 17%;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
  width: 33px;
  height: 33px;
  top: -13px;
  left: 14px;
}

.cloud::after {
  left: 38px;
  width: 25px;
  height: 25px;
  top: -8px;
}

.plant {
  position: absolute;
  bottom: 4%;
  font-size: clamp(30px, 8vw, 48px);
  opacity: .8;
}

.plant.left { left: 2%; }
.plant.right { right: 2%; }

.pet-wrap {
  position: relative;
  width: min(78vw, 330px);
  height: min(52vh, 360px);
  max-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.shadow {
  position: absolute;
  width: 67%;
  height: 9%;
  bottom: 5%;
  border-radius: 50%;
  background: #b96c9330;
  filter: blur(4px);
}

/* TOKY CHARACTER */

.pet {
  position: relative;
  width: 76%;
  height: 88%;
  max-height: 320px;
  animation: bob 3s ease-in-out infinite;
  transform-origin: 50% 90%;
  filter: drop-shadow(0 8px 3px #9f54741a);
}

.ear {
  position: absolute;
  top: 0;
  width: 35%;
  height: 37%;
  background: #f49ab9;
  border: 4px solid #d96f98;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  z-index: 1;
}

.ear::after {
  content: "";
  position: absolute;
  inset: 22% 22% 5%;
  background: #ffd0df;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.ear.l {
  left: 5%;
  transform: rotate(-12deg);
}

.ear.r {
  right: 5%;
  transform: rotate(12deg);
}

.head {
  position: absolute;
  z-index: 2;
  top: 17%;
  left: 5%;
  width: 90%;
  height: 51%;
  border: 4px solid #d96f98;
  border-radius: 44% 44% 42% 42%;
  background: linear-gradient(145deg, #ffbdd2, #f58fb2);
}

.face {
  position: absolute;
  inset: 0;
}

.brow {
  position: absolute;
  top: 28%;
  width: 15%;
  height: 5%;
  background: #d9c4cb;
  border-radius: 50%;
}

.brow.l {
  left: 21%;
  transform: rotate(-8deg);
}

.brow.r {
  right: 21%;
  transform: rotate(8deg);
}

.eye {
  position: absolute;
  top: 37%;
  width: 14%;
  height: 22%;
  background: white;
  border: 2px solid #694c63;
  border-radius: 50%;
  transition: height .12s, top .12s;
}

.eye::after {
  content: "";
  position: absolute;
  width: 65%;
  height: 73%;
  left: 18%;
  top: 13%;
  background: #5a9fe4;
  border-radius: 50%;
}

.eye::before {
  content: "";
  position: absolute;
  z-index: 1;
  width: 25%;
  height: 25%;
  left: 27%;
  top: 18%;
  background: white;
  border-radius: 50%;
}

.eye.l { left: 22%; }
.eye.r { right: 22%; }

.muzzle {
  position: absolute;
  bottom: 9%;
  left: 24%;
  width: 52%;
  height: 31%;
  background: #fff6f3;
  border-radius: 48% 48% 45% 45%;
}

.nose {
  position: absolute;
  top: 56%;
  left: 45%;
  width: 10%;
  height: 8%;
  background: #d94d72;
  clip-path: polygon(50% 100%, 0 0, 100% 0);
}

.mouth {
  position: absolute;
  top: 68%;
  left: 43%;
  width: 14%;
  height: 8%;
  border-bottom: 2px solid #a34c69;
  border-radius: 0 0 50% 50%;
}

.blush {
  position: absolute;
  top: 59%;
  width: 17%;
  height: 8%;
  border-radius: 50%;
  background: #f477a4aa;
  filter: blur(1px);
}

.blush.l { left: 10%; }
.blush.r { right: 10%; }

.body {
  position: absolute;
  z-index: 1;
  bottom: 5%;
  left: 15%;
  width: 70%;
  height: 38%;
  background: #f7a2bd;
  border: 4px solid #d96f98;
  border-radius: 45% 45% 35% 35%;
}

.belly {
  position: absolute;
  left: 20%;
  top: 20%;
  width: 60%;
  height: 67%;
  background: #fff6f3;
  border-radius: 48%;
}

.arm {
  position: absolute;
  z-index: 3;
  top: 70%;
  width: 23%;
  height: 14%;
  background: #f49ab9;
  border: 3px solid #d96f98;
  border-radius: 50%;
}

.arm.l {
  left: 4%;
  transform: rotate(30deg);
}

.arm.r {
  right: 4%;
  transform: rotate(-30deg);
}

.foot {
  position: absolute;
  z-index: 2;
  bottom: 0;
  width: 31%;
  height: 12%;
  background: #e978a0;
  border: 3px solid #d96f98;
  border-radius: 50%;
}

.foot.l { left: 15%; }
.foot.r { right: 15%; }

.hat {
  position: absolute;
  z-index: 4;
  top: 11%;
  left: 26%;
  width: 48%;
  height: 17%;
  background: #82b9f5;
  border: 3px solid #568cc7;
  border-radius: 48% 48% 18% 18%;
  transform: rotate(-5deg);
}

.hat::after {
  content: "";
  position: absolute;
  bottom: -6px;
  left: -7%;
  width: 114%;
  height: 9px;
  background: #679edb;
  border-radius: 50%;
}

.strawberry {
  position: absolute;
  z-index: 5;
  top: 4%;
  left: 55%;
  font-size: clamp(19px, 5vw, 26px);
  transform: rotate(20deg);
}

.strap {
  position: absolute;
  z-index: 4;
  right: 11%;
  top: 66%;
  width: 9%;
  height: 22%;
  background: #8acba5;
  border-radius: 10px;
  transform: rotate(-12deg);
}

.bag {
  position: absolute;
  z-index: 5;
  right: 0;
  top: 76%;
  font-size: clamp(22px, 6vw, 30px);
  transform: rotate(10deg);
}

/* DIALOGUE: LETTER BY LETTER */

.dialogue {
  flex: 0 0 auto;
  min-height: 62px;
  max-height: 76px;
  overflow: auto;
  background: #fffdf9ed;
  border: 2px solid white;
  border-radius: 18px;
  padding: 10px 13px;
  box-shadow: 0 5px 16px #a85d7c12;
  font-size: clamp(12px, 3.4vw, 14px);
  line-height: 1.4;
}

.dialogue strong {
  color: #df6e99;
}

.dialogue.speaking {
  animation: bubbleIn .22s ease-out;
}

.dialogue.speaking::after {
  content: "";
  display: inline-block;
  width: 5px;
  height: 1em;
  margin-left: 3px;
  vertical-align: -2px;
  background: #df6e99;
  animation: caret .7s steps(1) infinite;
}

@keyframes caret {
  50% { opacity: 0; }
}

@keyframes bubbleIn {
  from { transform: translateY(3px); opacity: .75; }
  to { transform: translateY(0); opacity: 1; }
}

/* ACTION BUTTONS */

.actions {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  margin-top: 8px;
}

.action {
  min-width: 0;
  min-height: 56px;
  border-radius: 15px;
  background: #fffdf7;
  border: 1px solid white;
  box-shadow: 0 3px 0 #e9c5d5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 5px 2px;
  font-size: clamp(9px, 2.6vw, 11px);
  font-weight: 800;
  line-height: 1.15;
}

.action .ico {
  font-size: clamp(18px, 5vw, 23px);
  line-height: 1.1;
}

.action:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #e9c5d5;
}

.footer {
  text-align: center;
  font-size: 10px;
  opacity: .62;
  margin-top: 6px;
  flex: 0 0 auto;
}

/* REACTION ANIMATIONS */

.pet.pat { animation: pat .85s ease; }
.pet.cheekAct { animation: cheek .65s ease; }
.pet.bellyAct { animation: belly .65s ease; }
.pet.hug { animation: hug .9s ease; }
.pet.food { animation: food .7s ease; }
.pet.story { animation: tilt .85s ease; }
.pet.sleep { animation: rest 1.1s ease forwards; }
.pet.wake { animation: wake .8s ease; }
.pet.talk { animation: tilt .55s ease; }
.pet.drawAct { animation: drawBounce .7s ease; }

.pet.pat .ear {
  animation: earWiggle .45s ease;
}

.pet.hug .arm {
  animation: armsHug .7s ease;
}

.pet.food .head {
  animation: nibble .4s ease 2;
}

.pet.cheekAct .blush {
  background: #f05b91dd;
}

.pet.bellyAct .belly {
  animation: tummy .45s ease;
}

.pet.story .ear {
  animation: earWiggle .6s ease;
}

.pet.blink .eye,
.pet.sleep .eye {
  height: 3%;
  top: 47%;
  background: #d96f98;
  border-radius: 50%;
}

.pet.blink .eye::before,
.pet.blink .eye::after,
.pet.sleep .eye::before,
.pet.sleep .eye::after {
  display: none;
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes pat {
  0%, 100% { transform: rotate(0); }
  35% { transform: rotate(-7deg) translateY(-7px); }
  70% { transform: rotate(5deg); }
}

@keyframes cheek {
  0%, 100% { transform: scaleX(1); }
  35% { transform: scaleX(.84) scaleY(1.04); }
  70% { transform: scaleX(1.05); }
}

@keyframes belly {
  0%, 100% { transform: scale(1); }
  40% { transform: scale(1.05) rotate(2deg); }
}

@keyframes hug {
  0%, 100% { transform: scale(1); }
  35% { transform: scale(.9, 1.04); }
  65% { transform: scale(1.06, .98); }
}

@keyframes food {
  0%, 100% { transform: translateY(0); }
  40% { transform: translateY(-12px) rotate(4deg); }
}

@keyframes tilt {
  0%, 100% { transform: rotate(0); }
  35% { transform: rotate(8deg); }
  70% { transform: rotate(-6deg); }
}

@keyframes drawBounce {
  0%, 100% { transform: translateY(0); }
  35% { transform: translateY(-10px) rotate(-3deg); }
  70% { transform: translateY(2px) rotate(3deg); }
}

@keyframes earWiggle {
  0%, 100% { rotate: 0deg; }
  40% { rotate: 8deg; }
  70% { rotate: -6deg; }
}

@keyframes armsHug {
  0%, 100% { scale: 1; }
  40% { scale: 1.25; }
}

@keyframes nibble {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 4px; }
}

@keyframes tummy {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(.85, 1.12); }
}

@keyframes rest {
  to { transform: translateY(9px) scale(.96); }
}

@keyframes wake {
  0% { transform: translateY(9px) scale(.96); }
  55% { transform: translateY(-12px) scale(1.04); }
  100% { transform: translateY(0) scale(1); }
}

/* DRAWING WINDOW */

.modal {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: #62435477;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal.open {
  display: flex;
}

.card {
  width: min(100%, 420px);
  background: #fff9f3;
  border: 2px solid white;
  border-radius: 22px;
  padding: 15px;
  box-shadow: 0 12px 35px #48233644;
}

.card h2 {
  margin: 0 0 8px;
  font-size: 19px;
}

.card p {
  font-size: 13px;
  margin: 0 0 10px;
}

.tools {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin: 8px 0;
}

.tools button,
.close {
  background: #ffe0ec;
  padding: 8px 11px;
  border-radius: 12px;
  font-size: 12px;
}

.tools input {
  width: 38px;
  height: 34px;
  border: 0;
  background: transparent;
}

.canvas-wrap {
  background: white;
  border: 1px solid #efd6e0;
  border-radius: 12px;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 190px;
  touch-action: none;
}

.close {
  margin-top: 9px;
  background: #dff3e8;
}

.heart {
  position: absolute;
  font-size: 23px;
  pointer-events: none;
  animation: heart 1s ease-out forwards;
  z-index: 8;
}

@keyframes heart {
  to {
    transform: translateY(-55px) scale(1.5);
    opacity: 0;
  }
}

/* SMALL SCREENS */

@media (max-height: 700px) {
  .energy {
    margin-top: 5px;
    padding: 5px 9px;
  }

  .scene {
    margin: 0;
  }

  .pet-wrap {
    height: min(44vh, 290px);
  }

  .dialogue {
    min-height: 52px;
    max-height: 60px;
    padding: 7px 10px;
  }

  .actions {
    gap: 5px;
    margin-top: 6px;
  }

  .action {
    min-height: 48px;
    border-radius: 12px;
  }

  .footer {
    margin-top: 4px;
  }
}

@media (max-width: 360px) {
  .app {
    padding-left: 8px;
    padding-right: 8px;
  }

  .action {
    font-size: 9px;
  }

  .actions {
    gap: 4px;
  }

  .pet-wrap {
    width: 72vw;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
</head>

<body>
<main class="app">

  <header class="top">
    <div class="brand">Mr. <span>Toky</span> 🍓</div>
    <div class="mood">🍓 เพื่อนตัวจิ๋วของแกรนนี่</div>
  </header>

  <div class="energy">
    <label>🍓 พลังงานของโทกี้</label>
    <div class="bar"><div class="fill" id="energyFill"></div></div>
    <b id="energyNum">78%</b>
  </div>

  <section class="scene" id="scene">
    <div class="sun"></div>
    <div class="cloud"></div>
    <div class="plant left">🪴</div>
    <div class="plant right">🌷</div>

    <div class="pet-wrap">
      <div class="shadow"></div>

      <div class="pet" id="pet" aria-label="Mr. Toky pink fox">
        <div class="ear l"></div>
        <div class="ear r"></div>

        <div class="body">
          <div class="belly"></div>
        </div>

        <div class="foot l"></div>
        <div class="foot r"></div>
        <div class="arm l"></div>
        <div class="arm r"></div>

        <div class="strap"></div>
        <div class="bag">🍓</div>

        <div class="head">
          <div class="face">
            <div class="brow l"></div>
            <div class="brow r"></div>
            <div class="eye l"></div>
            <div class="eye r"></div>
            <div class="blush l"></div>
            <div class="blush r"></div>
            <div class="muzzle"></div>
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
        </div>

        <div class="hat"></div>
        <div class="strawberry">🍓</div>
      </div>
    </div>
  </section>

  <div class="dialogue" aria-live="off">
    <strong>โทกี้:</strong>
    <span id="line">แกรนนี่ครับ! วันนี้มาเล่นกับไอแล้วเหรอครับ kub 🍓</span>
  </div>

  <section class="actions" id="actions">
    <button class="action" data-act="pat">
      <span class="ico">🫳</span>ลูบหัว
    </button>

    <button class="action" data-act="cheek">
      <span class="ico">😊</span>บีบแก้ม
    </button>

    <button class="action" data-act="belly">
      <span class="ico">👉</span>จิ้มพุง
    </button>

    <button class="action" data-act="hug">
      <span class="ico">🫂</span>กอด
    </button>

    <button class="action" data-act="draw">
      <span class="ico">🎨</span>วาดรูปกับโทกี้
    </button>

    <button class="action" data-act="food">
      <span class="ico">🍓</span>ป้อนอาหาร
    </button>

    <button class="action" data-act="story">
      <span class="ico">📖</span>ฟังโทกี้เล่าเรื่อง
    </button>

    <button class="action" data-act="sleep">
      <span class="ico">🌙</span>ส่งโทกี้เข้านอน
    </button>

    <button class="action" data-act="talk">
      <span class="ico">💬</span>พูดคุย
    </button>

    <button class="action" data-act="wake">
      <span class="ico">☀️</span>ปลุกโทกี้ตอนหลับ
    </button>
  </section>

  <div class="footer">
    แตะปุ่มเพื่อเล่นกับโทกี้ · พักผ่อนและเติมพลังกันด้วยนะ 🍓
  </div>

  <!-- DRAWING MODAL -->
  <div class="modal" id="drawModal">
    <div class="card">
      <h2>🎨 วาดรูปกับโทกี้</h2>
      <p>มาวาดรูปด้วยกันนะครับแกรนนี่! วาดเสร็จแล้วกดบันทึกรูปได้เลย</p>

      <div class="tools">
        <label>
          สี
          <input id="color" type="color" value="#f078a4">
        </label>

        <button id="eraser">ยางลบ</button>
        <button id="clear">ล้างกระดาษ</button>
        <button id="save">บันทึกรูป</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas" width="700" height="380"></canvas>
      </div>

      <button class="close" id="closeDraw">เสร็จแล้ว</button>
    </div>
  </div>

</main>

<script>
/* =========================================
   TOKY DIALOGUES
========================================= */

const lines = {
  pat: [
    "แกรนนี่ครับ วันนี้ไอจัดทรงผมมาตั้งนานเลยนะครับ แต่ถ้าแกรนนี่จะลูบก็ไม่เป็นไรครับ เดี๋ยวค่อยจัดใหม่ก็ได้ kub",

/* =========================================
   DIALOGUE TYPEWRITER
   ค่อย ๆ ขึ้นทีละตัวอักษร
========================================= */

const pet = document.getElementById("pet");
const line = document.getElementById("line");
const fill = document.getElementById("energyFill");
const num = document.getElementById("energyNum");

let energy = 78;
let sleeping = false;
let previous = {};
let typingTimer = null;
let typeToken = 0;

function say(text) {
  typeToken++;
  const token = typeToken;

  if (typingTimer) {
    clearInterval(typingTimer);
  }

  const box = line.closest(".dialogue");
  box.classList.remove("speaking");

  line.textContent = "";
  let i = 0;

  box.classList.add("speaking");

  // ค่อย ๆ แสดงข้อความทีละตัวอักษร
  typingTimer = setInterval(() => {
    if (token !== typeToken) {
      clearInterval(typingTimer);
      return;
    }

    line.textContent = text.slice(0, i + 1);
    i++;

    if (i >= text.length) {
      clearInterval(typingTimer);
      typingTimer = null;
      box.classList.remove("speaking");
    }
  }, 32);
}


/* =========================================
   ENERGY
========================================= */

function setEnergy(value) {
  energy = Math.max(0, Math.min(100, value));
  fill.style.width = energy + "%";
  num.textContent = energy + "%";
}


/* =========================================
   HEART EFFECT
========================================= */

function hearts() {
  const scene = document.getElementById("scene");

  for (let i = 0; i < 3; i++) {
    const heart = document.createElement("span");

    heart.className = "heart";
    heart.textContent = ["💗", "✨", "🍓"][i];
    heart.style.left = (42 + Math.random() * 20) + "%";
    heart.style.top = (38 + Math.random() * 15) + "%";

    scene.appendChild(heart);

    setTimeout(() => heart.remove(), 1000);
  }
}


/* =========================================
   CHARACTER ANIMATIONS
========================================= */

function animate(action) {
  const classes = [
    "pat", "cheekAct", "bellyAct", "hug",
    "food", "story", "sleep", "wake",
    "talk", "drawAct"
  ];

  pet.classList.remove(...classes);

  // บังคับให้เบราว์เซอร์เริ่มแอนิเมชันใหม่
  void pet.offsetWidth;

  const animationClass = {
    pat: "pat",
    cheek: "cheekAct",
    belly: "bellyAct",
    hug: "hug",
    food: "food",
    story: "story",
    sleep: "sleep",
    wake: "wake",
    talk: "talk",
    draw: "drawAct"
  }[action];

  if (animationClass) {
    pet.classList.add(animationClass);

    setTimeout(() => {
      pet.classList.remove(animationClass);
    }, 1200);
  }

  if (["hug", "pat", "food", "wake"].includes(action)) {
    hearts();
  }
}


/* =========================================
   REACTION BUTTONS
========================================= */

function react(action) {
  if (action === "draw") {
    openDraw();

    const arr = lines.draw;
    let index = Math.floor(Math.random() * arr.length);

    if (arr.length > 1 && index === previous.draw) {
      index = (index + 1) % arr.length;
    }

    previous.draw = index;

    say(arr[index]);
    animate("draw");
    setEnergy(energy - 2);
    return;
  }

  if (action === "sleep" && sleeping) {
    say("แกรนนี่ครับ ไอหลับอยู่เลยนะครับ ถ้าจะปลุกก็แตะปุ่มปลุกโทกี้ได้เลย");
    return;
  }

  if (action === "wake" && !sleeping) {
    say("ไอตื่นอยู่แล้วครับแกรนนี่ มีอะไรให้ไอช่วยไหม kub");
    animate("wake");
    return;
  }

  if (sleeping && action !== "wake") {
    say("Zzz... แกรนนี่ครับ ไอกำลังหลับอยู่ ปลุกไอก่อนนะครับ 🍓");
    return;
  }

  if (action === "sleep") {
    sleeping = true;
  }

  if (action === "wake") {
    sleeping = false;
  }

  const arr = lines[action] || lines.talk;
  let index = Math.floor(Math.random() * arr.length);

  // ไม่ให้พูดประโยคเดิมซ้ำติดกันในปุ่มเดิม
  if (arr.length > 1 && index === previous[action]) {
    index = (index + 1) % arr.length;
  }

  previous[action] = index;

  say(arr[index]);
  animate(action);

  if (action === "sleep") {
    setEnergy(energy + 5);
  } else if (action === "wake") {
    setEnergy(energy - 1);
  } else {
    setEnergy(energy - 3);
  }
}

document.querySelectorAll(".action").forEach(button => {
  button.addEventListener("click", () => {
    react(button.dataset.act);
  });
});


/* =========================================
   IDLE BLINK
========================================= */

setInterval(() => {
  if (!sleeping && Math.random() < 0.55) {
    pet.classList.add("blink");

    setTimeout(() => {
      pet.classList.remove("blink");
    }, 170);
  }
}, 2600);


/* =========================================
   ENERGY SLOWLY DECREASES
========================================= */

setInterval(() => {
  if (!sleeping) {
    setEnergy(energy - 1);
  }
}, 18000);


/* =========================================
   IDLE DIALOGUE
========================================= */

setInterval(() => {
  if (sleeping) return;

  const idleLines = [
    "แกรนนี่ครับ... ไออยู่นี่นะครับ 🍓",
    "ไอสงสัยว่าถ้าสตรอว์เบอร์รีใส่หมวก จะน่ารักเหมือนไอไหมนะครับ",
    "แกรนนี่พักสายตาบ้างนะครับ ไอจะนั่งเป็นเพื่อนตรงนี้",
    "วันนี้บรรยากาศ cozy ดีจังเลยครับ kub"
  ];

  if (Math.random() < 0.6) {
    say(idleLines[Math.floor(Math.random() * idleLines.length)]);
  }
}, 32000);


/* =========================================
   DRAWING CANVAS
========================================= */

const modal = document.getElementById("drawModal");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let erase = false;
let last = null;

function resetCanvas() {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 8;
  ctx.strokeStyle = document.getElementById("color").value;
}

resetCanvas();

function openDraw() {
  modal.classList.add("open");
}

document.getElementById("closeDraw").onclick = () => {
  modal.classList.remove("open");
};

document.getElementById("clear").onclick = resetCanvas;

document.getElementById("eraser").onclick = () => {
  erase = !erase;

  document.getElementById("eraser").textContent =
    erase ? "ใช้ยางลบอยู่" : "ยางลบ";
};

document.getElementById("color").oninput = () => {
  if (!erase) {
    ctx.strokeStyle = document.getElementById("color").value;
  }
};

document.getElementById("save").onclick = () => {
  const link = document.createElement("a");

  link.download = "toky-drawing.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

  say("แกรนนี่ครับ เราบันทึกรูปของเราไว้แล้วนะครับ ไอจะจำวันนี้ไว้เลย 🍓");

  modal.classList.remove("open");
};

function getPoint(event) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: (event.clientX - rect.left) * canvas.width / rect.width,
    y: (event.clientY - rect.top) * canvas.height / rect.height
  };
}

canvas.addEventListener("pointerdown", event => {
  drawing = true;
  last = getPoint(event);
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", event => {
  if (!drawing) return;

  const point = getPoint(event);

  ctx.beginPath();
  ctx.moveTo(last.x, last.y);
  ctx.lineTo(point.x, point.y);

  ctx.strokeStyle = erase
    ? "#ffffff"
    : document.getElementById("color").value;

  ctx.lineWidth = erase ? 28 : 8;
  ctx.stroke();

  last = point;
});

canvas.addEventListener("pointerup", () => {
  drawing = false;
});

canvas.addEventListener("pointercancel", () => {
  drawing = false;
});
</script>
