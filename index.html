<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mr. Toky 🍓</title>

<style>
:root {
  --pink: #ffb7d2;
  --dark-pink: #f078a6;
  --cream: #fff8f3;
  --text: #74475a;
  --purple: #c7b5f5;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, #fff0f6, #fff9f1);
}

.app {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  padding: 18px 16px 30px;
  overflow: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  color: #e96e9c;
}

.subtitle {
  font-size: 12px;
  opacity: .7;
  margin-top: 3px;
}

.icon-button {
  border: 0;
  background: white;
  border-radius: 50%;
  width: 43px;
  height: 43px;
  font-size: 20px;
  box-shadow: 0 4px 12px #e9b7cb55;
}

.status-card {
  background: #fff;
  padding: 14px 16px;
  border-radius: 20px;
  box-shadow: 0 5px 18px #e9b7cb33;
}

.status-top {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
}

.energy-track {
  height: 11px;
  border-radius: 20px;
  background: #f5e5ec;
  overflow: hidden;
}

.energy-fill {
  width: 85%;
  height: 100%;
  background: linear-gradient(90deg, #ff91bb, #ffcb91);
  border-radius: inherit;
  transition: width .4s;
}

.room {
  position: relative;
  margin-top: 16px;
  height: 350px;
  border-radius: 28px;
  overflow: hidden;
  background: linear-gradient(#e8e0ff 0%, #f9e7f1 66%, #f7d9e5 66%);
  box-shadow: 0 7px 22px #d9b6cf44;
}

.window {
  position: absolute;
  width: 105px;
  height: 110px;
  top: 25px;
  left: 24px;
  border: 7px solid #fff9ff;
  border-radius: 14px;
  background: linear-gradient(#c8e9ff, #fff4d7);
  overflow: hidden;
}

.window:before {
  content: "";
  position: absolute;
  height: 100%;
  width: 5px;
  left: 43px;
  background: #fff9ff;
}

.window:after {
  content: "";
  position: absolute;
  width: 100%;
  height: 5px;
  top: 48px;
  background: #fff9ff;
}

.sun {
  position: absolute;
  right: 12px;
  top: 10px;
  font-size: 23px;
}

.wall-heart {
  position: absolute;
  right: 26px;
  top: 38px;
  font-size: 27px;
  opacity: .7;
}

.rug {
  position: absolute;
  width: 245px;
  height: 68px;
  border-radius: 50%;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: #ffd5e6;
  border: 4px solid #fff0f6;
}

/* ตัวละครจิ้งจอกจำลอง */
#toky {
  position: absolute;
  width: 175px;
  height: 225px;
  left: 50%;
  top: 48%;
  transform: translate(-50%, -50%);
  transform-origin: 50% 80%;
  z-index: 3;
  transition: filter .2s;
}

.ears {
  position: absolute;
  width: 100%;
  height: 90px;
  top: 0;
}

.ear {
  position: absolute;
  width: 57px;
  height: 93px;
  top: 0;
  background: #ff9fc4;
  border: 4px solid #e875a2;
  border-radius: 70% 70% 25% 25%;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.ear.left {
  left: 18px;
  transform: rotate(-13deg);
}

.ear.right {
  right: 18px;
  transform: rotate(13deg);
}

.ear:after {
  content: "";
  position: absolute;
  left: 15px;
  top: 25px;
  width: 25px;
  height: 50px;
  background: #ffc7dc;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.head {
  position: absolute;
  width: 145px;
  height: 132px;
  top: 43px;
  left: 15px;
  background: #ffb2d0;
  border: 4px solid #e875a2;
  border-radius: 48% 48% 45% 45%;
  z-index: 2;
}

.face {
  position: absolute;
  width: 107px;
  height: 69px;
  left: 15px;
  bottom: 5px;
  background: #fff9f4;
  border-radius: 45% 45% 48% 48%;
}

.eye {
  position: absolute;
  top: 43px;
  width: 23px;
  height: 30px;
  background: #fff;
  border: 2px solid #6e5267;
  border-radius: 50%;
  overflow: hidden;
}

.eye.left { left: 30px; }
.eye.right { right: 30px; }

.eye:after {
  content: "";
  position: absolute;
  width: 15px;
  height: 21px;
  left: 3px;
  top: 4px;
  background: #59aee8;
  border: 2px solid #386b9d;
  border-radius: 50%;
}

.eye:before {
  content: "";
  position: absolute;
  z-index: 2;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  left: 7px;
  top: 7px;
}

.brow {
  position: absolute;
  top: 34px;
  width: 24px;
  height: 5px;
  background: #d5cbd1;
  border-radius: 10px;
}

.brow.left { left: 29px; transform: rotate(-8deg); }
.brow.right { right: 29px; transform: rotate(8deg); }

.muzzle {
  position: absolute;
  bottom: 10px;
  left: 48px;
  width: 42px;
  height: 25px;
  background: white;
  border-radius: 50%;
}

.nose {
  position: absolute;
  left: 64px;
  bottom: 29px;
  width: 13px;
  height: 9px;
  background: #ed657e;
  border-radius: 50% 50% 60% 60%;
  z-index: 2;
}

.mouth {
  position: absolute;
  left: 68px;
  bottom: 21px;
  width: 5px;
  height: 8px;
  border-left: 2px solid #9b536b;
  border-bottom: 2px solid #9b536b;
  z-index: 2;
}

.blush {
  position: absolute;
  top: 83px;
  width: 22px;
  height: 10px;
  background: #ff89af;
  border-radius: 50%;
  opacity: .7;
}

.blush.left { left: 17px; }
.blush.right { right: 17px; }

.body-fur {
  position: absolute;
  width: 105px;
  height: 91px;
  top: 148px;
  left: 35px;
  border-radius: 43% 43% 35% 35%;
  background: #ff9fc4;
  border: 4px solid #e875a2;
  z-index: 1;
}

.belly {
  position: absolute;
  width: 61px;
  height: 60px;
  top: 13px;
  left: 18px;
  background: #fff8f2;
  border-radius: 50%;
}

.foot {
  position: absolute;
  width: 38px;
  height: 25px;
  bottom: -5px;
  background: #f27eaa;
  border-radius: 50%;
}

.foot.left { left: 9px; }
.foot.right { right: 9px; }

.hat {
  position: absolute;
  z-index: 5;
  top: 35px;
  left: 50%;
  width: 87px;
  height: 37px;
  transform: translateX(-50%) rotate(-5deg);
  border-radius: 45px 45px 10px 10px;
  background: #7ca9fa;
  border: 3px solid #527acb;
}

.hat:after {
  content: "🍓";
  position: absolute;
  right: -10px;
  top: -22px;
  font-size: 25px;
}

.strap {
  position: absolute;
  z-index: 4;
  width: 13px;
  height: 70px;
  background: #8ed0a4;
  right: 27px;
  top: 154px;
  transform: rotate(-12deg);
  border-radius: 10px;
}

.bag {
  position: absolute;
  z-index: 4;
  right: 4px;
  top: 186px;
  font-size: 33px;
}

#toky.reacting {
  animation: bounce .55s ease;
}

#toky.pet {
  animation: pet .65s ease;
}

#toky.cheek {
  animation: cheek .6s ease;
}

#toky.belly {
  animation: belly .55s ease;
}

#toky.hug {
  animation: hug .7s ease;
}

#toky.draw {
  animation: draw .8s ease;
}

#toky.food {
  animation: food .7s ease;
}

#toky.story {
  animation: story .7s ease;
}

#toky.sleeping {
  transform: translate(-50%, -50%) rotate(90deg) scale(.8);
  top: 57%;
}

#toky.sleeping .eye {
  height: 3px;
  top: 54px;
}

#toky.sleeping .eye:after,
#toky.sleeping .eye:before {
  display: none;
}

#toky.sleeping .mouth {
  width: 9px;
  height: 5px;
  border: 2px solid #9b536b;
  border-top: 0;
  border-radius: 0 0 50% 50%;
}

@keyframes bounce {
  0%,100% { margin-top: 0; }
  40% { margin-top: -15px; }
  70% { margin-top: 3px; }
}

@keyframes pet {
  0%,100% { transform: translate(-50%,-50%) rotate(0); }
  35% { transform: translate(-50%,-54%) rotate(-8deg) scale(1.04); }
  70% { transform: translate(-50%,-48%) rotate(5deg); }
}

@keyframes cheek {
  0%,100% { transform: translate(-50%,-50%) scaleX(1); }
  35%,65% { transform: translate(-50%,-50%) scaleX(.88) scaleY(1.04); }
}

@keyframes belly {
  0%,100% { transform: translate(-50%,-50%) rotate(0); }
  30% { transform: translate(-50%,-50%) rotate(8deg); }
  65% { transform: translate(-50%,-50%) rotate(-7deg); }
}

@keyframes hug {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  45% { transform: translate(-50%,-50%) scale(1.12,.94); }
}

@keyframes draw {
  0%,100% { transform: translate(-50%,-50%) rotate(0); }
  30% { transform: translate(-54%,-50%) rotate(-9deg); }
  70% { transform: translate(-46%,-50%) rotate(9deg); }
}

@keyframes food {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  35% { transform: translate(-50%,-47%) scale(1.05); }
  60% { transform: translate(-50%,-50%) scale(.97); }
}

@keyframes story {
  0%,100% { transform: translate(-50%,-50%) rotate(0); }
  35% { transform: translate(-50%,-50%) rotate(7deg); }
  70% { transform: translate(-50%,-50%) rotate(-7deg); }
}

.speech {
  position: relative;
  margin: 17px 0;
  padding: 16px;
  background: white;
  border: 2px solid #ffe0ed;
  border-radius: 20px;
  line-height: 1.65;
  font-size: 14px;
  min-height: 80px;
  box-shadow: 0 4px 15px #e9b7cb33;
}

.speech:before {
  content: "💬";
  position: absolute;
  top: -12px;
  left: 14px;
  background: white;
  border-radius: 50%;
  padding: 2px;
}

.speech-name {
  font-weight: 900;
  color: #e96e9c;
  margin-bottom: 5px;
}

.section-title {
  font-size: 16px;
  font-weight: 900;
  margin: 20px 0 10px;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.action {
  min-height: 65px;
  padding: 10px;
  border: 2px solid transparent;
  border-radius: 17px;
  background: #fff;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 3px 12px #e9b7cb26;
  cursor: pointer;
  transition: transform .12s, background .15s;
}

.action:active {
  transform: scale(.94);
  background: #ffe1ed;
}

.action .emoji {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}

.action.wide {
  grid-column: span 2;
}

.action:disabled {
  opacity: .55;
}

.bottom-note {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  opacity: .65;
}

.floating {
  position: absolute;
  z-index: 9;
  pointer-events: none;
  animation: floatUp 1s ease-out forwards;
  font-size: 24px;
}

@keyframes floatUp {
  from { opacity: 1; transform: translateY(0) scale(.8); }
  to { opacity: 0; transform: translateY(-90px) scale(1.4); }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <div class="logo">🍓 Mr. Toky</div>
    <div class="subtitle">Your little fox companion</div>
  </div>
  <button class="icon-button" onclick="toggleMusic()" id="musicBtn" aria-label="เสียง">🔈</button>
</header>

<section class="status-card">
  <div class="status-top">
    <span>💗 ความสุขของโทกี้</span>
    <strong id="energyLabel">85%</strong>
  </div>
  <div class="energy-track">
    <div class="energy-fill" id="energyFill"></div>
  </div>
</section>

<section class="room" id="room">
  <div class="window"><span class="sun">☀️</span></div>
  <div class="wall-heart">♡</div>
  <div class="rug"></div>

  <div id="toky">
    <div class="ears">
      <div class="ear left"></div>
      <div class="ear right"></div>
    </div>
    <div class="head">
      <div class="brow left"></div>
      <div class="brow right"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="blush left"></div>
      <div class="blush right"></div>
      <div class="face"></div>
      <div class="muzzle"></div>
      <div class="nose"></div>
      <div class="mouth"></div>
    </div>
    <div class="hat"></div>
    <div class="body-fur">
      <div class="belly"></div>
      <div class="foot left"></div>
      <div class="foot right"></div>
    </div>
    <div class="strap"></div>
    <div class="bag">🍓</div>
  </div>
</section>

<section class="speech" aria-live="polite">
  <div class="speech-name">Mr. Toky 🩷</div>
  <div id="dialogue">แกรนนี่ครับ วันนี้จะเล่นอะไรกับโทกี้ดีครับ kub</div>
</section>

<div class="section-title">🩷 เล่นกับโทกี้</div>

<section class="actions">
  <button class="action" onclick="react('pet')">
    <span class="emoji">🩷</span>ลูบหัว
  </button>

  <button class="action" onclick="react('cheek')">
    <span class="emoji">🥹</span>บีบแก้ม
  </button>

  <button class="action" onclick="react('belly')">
    <span class="emoji">👉</span>จิ้มพุง
  </button>

  <button class="action" onclick="react('hug')">
    <span class="emoji">🫂</span>กอด
  </button>

  <button class="action" onclick="react('draw')">
    <span class="emoji">🎨</span>วาดรูปกับโทกี้
  </button>

  <button class="action" onclick="react('food')">
    <span class="emoji">🍓</span>ป้อนอาหาร
  </button>

  <button class="action" onclick="react('story')">
    <span class="emoji">💬</span>ฟังโทกี้เล่าเรื่อง
  </button>

  <button class="action" onclick="react('talk')">
    <span class="emoji">💗</span>พูดคุย
  </button>

  <button class="action" onclick="react('sleep')">
    <span class="emoji">🌙</span>ส่งโทกี้เข้านอน
  </button>

  <button class="action" onclick="react('wake')">
    <span class="emoji">☀️</span>ปลุกโทกี้ตอนหลับ
  </button>
</section>

<div class="bottom-note">
  Made with love for Mr. Toky 🍓
</div>

</div>

<script>
const lines = {
  pet: [
    "แกรนนี่ครับ วันนี้ไอจัดทรงผมมาตั้งนานเลยนะครับ แต่ถ้าแกรนนี่จะลูบก็ไม่เป็นไรครับ เดี๋ยวค่อยจัดใหม่ก็ได้ kub",
    "โอเคครับแกรนนี่ ลูบอีกนิดก็ได้ครับ... แค่นิดเดียวนะ",
    "แกรนนี่ครับ ผมไม่ได้อ้อนนะครับ แค่หัวผมอยู่ใกล้มือแกรนนี่พอดี",
    "Now I'm ready for the day ครับ! เพราะแกรนนี่ลูบหัวให้แล้ว",
    "สบายจังครับ แต่ห้ามบอกใครนะว่าผมชอบให้ลูบหัว"
  ],

  cheek: [
    "แกรนนี่ครับ แก้มผมไม่ใช่โมจินะครับ บีบเบา ๆ หน่อย",
    "อ๊ะ! แก้มผมย้วยหมดแล้วครับ แต่... อีกข้างก็ได้ครับ",
    "แกรนนี่แกล้งผมอีกแล้วนะครับ ผมจะจำไว้เลย",
    "ผมไม่ได้แก้มแดงนะครับ ห้องมันร้อนเฉย ๆ",
    "แกรนนี่ครับ ถ้าบีบแก้มแล้วต้องรับผิดชอบด้วยนะครับ"
  ],

  belly: [
    "แกรนนี่! พุงผมครับ ไม่ใช่ปุ่มกดเล่นนะครับ",
    "ฮะ ๆ ครับ จั๊กจี้นะครับ หยุดก่อนครับ!",
    "ผมจะเก็บคะแนนแกล้งแกรนนี่คืนบ้างแล้วนะ",
    "แกรนนี่ครับ ทำหน้าไม่รู้ไม่ชี้แบบนั้นหมายความว่ายังไงครับ",
    "อีกทีผมก็หัวเราะอีกนะครับ อย่ามาหาว่าผมไม่เตือน"
  ],

  hug: [
    "แกรนนี่ครับ ขออยู่แบบนี้อีกนิดได้ไหมครับ",
    "วันนี้เหนื่อยไหมครับ ถ้าเหนื่อยก็มาพักกับผมได้นะ",
    "อุ่นจังครับ... ผมชอบนะ kub",
    "ไม่ต้องพูดอะไรก็ได้ครับ ผมอยู่ตรงนี้นะ",
    "กอดนี้ผมขอเก็บไว้เป็นพลังใจนะครับ"
  ],

  draw: [
    "แกรนนี่ครับ วันนี้เราวาดรูปสตรอว์เบอร์รี่กันไหมครับ",
    "ผมวาดรูปตัวเองแล้วทำไมดูหล่อขนาดนี้นะครับ",
    "แกรนนี่วาดอะไรก็ได้ครับ เดี๋ยวผมวาดด้วย",
    "รูปนี้ผมจะเก็บไว้ดี ๆ เลยครับ ห้ามเอาไปทิ้งนะ",
    "อันนี้เป็นผลงานชิ้นเอกของเราเลยครับ!"
  ],

  food: [
    "อันนี้ของผมเหรอครับ ขอบคุณนะครับแกรนนี่",
    "อร่อยครับ! ขออีกคำได้ไหมครับ นะครับ ๆ",
    "แกรนนี่ดูแลผมดีเกินไปแล้วนะครับ ผมจะเคยตัวแล้ว",
    "คำสุดท้ายแล้วครับ... โอเค อีกคำสุดท้ายจริง ๆ ครับ",
    "แบ่งให้แกรนนี่ด้วยไหมครับ... ล้อเล่นครับ ผมกินหมดแล้ว"
  ],

  story: [
    "แกรนนี่ครับ วันนี้ผมมีเรื่องจะเล่าให้ฟังด้วย",
    "แล้วรู้ไหมครับว่าตอนจบเป็นยังไง... เดี๋ยวผมเล่าต่อครับ",
    "เรื่องนี้เป็นความลับนะครับ แกรนนี่ห้ามเอาไปบอกใคร",
    "แกรนนี่ฟังอยู่ใช่ไหมครับ ไม่ได้แอบเล่นมือถืออย่างอื่นนะ",
    "ไว้วันหลังผมมาเล่าต่อก็ได้ครับ วันนี้ผมพูดเยอะแล้ว"
  ],

  talk: [
    "แกรนนี่ครับ วันนี้เป็นยังไงบ้าง เล่าให้ผมฟังได้นะ",
    "ผมมีเรื่องของน้องก้อง🩷กับพี่โทมาเล่าด้วยครับ",
    "แกรนนี่อยู่คุยกับผมอีกหน่อยได้ไหมครับ",
    "วันนี้มีอะไรทำให้แกรนนี่ยิ้มได้บ้างหรือเปล่าครับ",
    "ผมอาจช่วยอะไรไม่ได้ทุกอย่าง แต่ผมพร้อมฟังนะครับ"
  ],

  sleep: [
    "แกรนนี่ครับ ส่งผมเข้านอนแล้วอย่าลืมห่มผ้าให้ผมนะครับ",
    "ฝันดีนะครับแกรนนี่ พรุ่งนี้มาเล่นกับผมอีกนะ kub",
    "ผมจะหลับแล้วนะครับ... ราตรีสวัสดิ์ครับ",
    "Good night ครับแกรนนี่ อย่านอนดึกมากนะครับ",
    "ผมง่วงแล้วครับ ขอพักตาก่อนนะ..."
  ],

  wake: [
    "แกรนนี่ครับ... ผมตื่นแล้วครับ ขอเวลาจัดหมวกแป๊บนึง",
    "อรุณสวัสดิ์ครับ วันนี้เราจะทำอะไรกันดีครับ",
    "ปลุกผมแล้วต้องอยู่เล่นด้วยกันนะครับ",
    "ผมตื่นแล้วครับ! วันนี้มีอะไรสนุก ๆ หรือเปล่า",
    "ขออีกห้านาทีได้ไหมครับ... ล้อเล่นครับ ตื่นแล้ว!"
  ]
};

const previous = {};
let energy = 85;
let sleeping = false;

const toky = document.getElementById("toky");
const dialogue = document.getElementById("dialogue");
const energyLabel = document.getElementById("energyLabel");
const energyFill = document.getElementById("energyFill");
const room = document.getElementById("room");

function updateEnergy(amount) {
  energy = Math.max(0, Math.min(100, energy + amount));
  energyLabel.textContent = energy + "%";
  energyFill.style.width = energy + "%";
}

function floatEmoji(emoji) {
  const el = document.createElement("div");
  el.className = "floating";
  el.textContent = emoji;
  el.style.left = (35 + Math.random() * 30) + "%";
  el.style.top = (35 + Math.random() * 25) + "%";
  room.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function speak(text) {
  dialogue.textContent = "";
  let i = 0;

  const timer = setInterval(() => {
    dialogue.textContent += text.charAt(i);
    i++;

    if (i >= text.length) {
      clearInterval(timer);
    }
  }, 22);
}

function animate(action) {
  toky.classList.remove(
    "reacting", "pet", "cheek", "belly", "hug",
    "draw", "food", "story"
  );

  void toky.offsetWidth;

  if (["pet", "cheek", "belly", "hug", "draw", "food", "story"].includes(action)) {
    toky.classList.add(action);
  } else {
    toky.classList.add("reacting");
  }
}

function react(action) {
  if (!lines[action]) return;

  if (action === "wake") {
    sleeping = false;
    toky.classList.remove("sleeping");
  }

  if (action === "sleep") {
    sleeping = true;
    toky.classList.add("sleeping");
  }

  if (sleeping && action !== "wake" && action !== "sleep") {
    speak("แกรนนี่ครับ... ผมง่วงอยู่เลย ขอปลุกผมก่อนนะครับ");
    floatEmoji("💤");
    return;
  }

  const options = lines[action];
  let index;

  do {
    index = Math.floor(Math.random() * options.length);
  } while (options.length > 1 && index === previous[action]);

  previous[action] = index;

  speak(options[index]);
  animate(action);

  if (action === "hug" || action === "pet" || action === "food") {
    updateEnergy(4);
    floatEmoji(action === "food" ? "🍓" : "💗");
  } else if (action === "belly" || action === "cheek") {
    updateEnergy(2);
    floatEmoji("✨");
  } else if (action === "sleep") {
    updateEnergy(5);
    floatEmoji("💤");
  } else if (action === "wake") {
    updateEnergy(-2);
    floatEmoji("☀️");
  } else {
    updateEnergy(1);
    floatEmoji("💕");
  }
}

let soundOn = false;

function toggleMusic() {
  soundOn = !soundOn;
  document.getElementById("musicBtn").textContent = soundOn ? "🔊" : "🔈";

  speak(
    soundOn
      ? "เปิดเสียงแล้วครับแกรนนี่ แต่เวอร์ชันนี้ยังไม่มีเพลงประกอบนะครับ"
      : "ปิดเสียงแล้วครับ"
  );
}

// แอนิเมชันขยับเบา ๆ ตอนอยู่นิ่ง
setInterval(() => {
  if (!sleeping && !toky.matches(":hover")) {
    toky.animate(
      [
        { transform: "translate(-50%,-50%) translateY(0)" },
        { transform: "translate(-50%,-50%) translateY(-3px)" },
        { transform: "translate(-50%,-50%) translateY(0)" }
      ],
      { duration: 1600, easing: "ease-in-out" }
    );
  }
}, 4000);
</script>
